<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>약 이름으로 성분·카피약 찾기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#F5F7F3; --card:#FFFFFF; --ink:#1F2D2A; --muted:#5B6B66; --line:#D5DDD8;
  --green:#0D7A58; --green-soft:#E3F1EA; --capsule:#F1B43C; --capsule-soft:#FDF3DC; --warn:#9A4B12;
  --radius-lg:22px; --radius-sm:8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#141A19; --card:#1C2422; --ink:#E6ECE9; --muted:#9AAAA4; --line:#33403C;
    --green:#4CC39A; --green-soft:#1D3A30; --capsule:#E9B04A; --capsule-soft:#3A3120; --warn:#F0A36B; color-scheme: dark; }
  .capsule .a{color:#0E2A20 !important}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.6;word-break:keep-all;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.wrap{max-width:860px;margin:0 auto;padding:40px 20px 64px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.2;letter-spacing:-0.03em;font-weight:800;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 28px}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:20px;font-weight:600;padding:18px 22px;border-radius:999px;
  border:2px solid var(--ink);background:var(--card);color:var(--ink);outline:none}
.search input:focus-visible{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.avail{display:inline-flex;align-items:center;gap:8px;margin:12px 6px 0;font-size:15px;cursor:pointer;user-select:none}
.avail input{width:18px;height:18px;accent-color:var(--green);margin:0}
.avail small{color:var(--muted);font-size:13px}
.hidden-note{color:var(--muted);font-size:13px;margin:8px 4px 0}
.typo{margin-top:8px}
.typo button{all:unset;cursor:pointer;color:var(--green);font-weight:700;border-bottom:1px solid currentColor;margin-right:10px}
.typo button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.status{margin:10px 6px 0;color:var(--muted);font-size:14px;min-height:22px}
.status.err{color:var(--warn)}
.suggest{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
.suggest li button{all:unset;box-sizing:border-box;display:flex;gap:12px;justify-content:space-between;align-items:baseline;
  width:100%;padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.suggest li button:hover,.suggest li button:focus-visible{background:var(--green-soft)}
.suggest li button:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.suggest .nm{font-weight:600}
.suggest .left{display:flex;flex-direction:column;gap:2px;min-width:0}
.suggest .cp{color:var(--muted);font-size:13px}
.suggest .co{color:var(--muted);font-size:14px;white-space:nowrap}
.more{color:var(--muted);font-size:14px;padding:10px 8px}

/* 선택한 약: 캡슐 모양 머리 부분이 이 화면의 기억점 */
.pick{margin-top:36px}
.capsule{display:grid;grid-template-columns:1fr 1fr;border-radius:999px;overflow:hidden;border:2px solid var(--ink)}
.capsule .a{background:var(--green);color:#fff;padding:18px 26px}
.capsule .b{background:var(--capsule);color:#2A2210;padding:18px 26px;display:flex;flex-direction:column;justify-content:center}
.capsule .a .name{font-size:clamp(19px,3.2vw,24px);font-weight:800;line-height:1.3;letter-spacing:-0.02em}
.capsule .a .sub{opacity:.85;font-size:14px;margin-top:2px}
.capsule .b .ing{font-weight:700;line-height:1.35}
.capsule .b .ing span{font-weight:500}
@media (max-width:620px){
  .capsule{grid-template-columns:1fr;border-radius:28px}
  .capsule .a,.capsule .b{padding:16px 20px}
}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--card)}

.info{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.info .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.info h3{margin:0 0 6px;font-size:15px;color:var(--green)}
.info .box.se h3{color:var(--warn)}
.info p{margin:0;font-size:15px;line-height:1.65}
.info-src{grid-column:1/-1;color:var(--muted);font-size:13px;margin:0}
.info-src a{color:var(--green)}
@media (max-width:620px){ .info{grid-template-columns:1fr} }
.pill{margin:16px 0 0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.pill img{max-width:min(420px,100%);height:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
.pill figcaption,.photo td small{color:var(--muted);font-size:12px}
.phbtn{font:inherit;font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.phbtn[aria-expanded="true"]{background:var(--green-soft);border-color:var(--green)}
.phbtn:focus-visible{outline:2px solid var(--green);outline-offset:1px}
tr.photo td{background:var(--paper)}
tr.photo img{max-width:min(360px,100%);height:auto;border-radius:10px;border:1px solid var(--line);background:#fff;display:block}
section.group{margin-top:40px}
.ghead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
.ghead .n{font-size:40px;font-weight:800;line-height:1;letter-spacing:-0.03em;color:var(--green)}
.ghead h2{font-size:20px;margin:0;font-weight:700}
.ghead p{margin:0;color:var(--muted);font-size:14px;flex-basis:100%}
.filter{margin:14px 0 4px}
.filter input{font:inherit;width:100%;max-width:320px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--card);color:var(--ink)}
.filter input:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.tbl{overflow-x:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.diff{font-size:14px;color:var(--muted)}
td.diff b{color:var(--ink);font-weight:600}
td.date,td.kind{white-space:nowrap;color:var(--muted)}
@media (max-width:620px){ th.kind,td.kind{display:none} }
tr.me td{background:var(--capsule-soft)}
td .first{display:inline-block;font-size:12px;font-weight:700;color:var(--green);border:1px solid var(--green);border-radius:999px;padding:0 8px;margin-left:6px;white-space:nowrap}
a.prod{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
a.prod:hover{border-color:var(--green);color:var(--green)}
a.prod:focus-visible{outline:2px solid var(--green);outline-offset:2px}
details.strength{border-bottom:1px solid var(--line)}
details.strength summary{cursor:pointer;padding:12px 4px;font-weight:600}
details.strength summary span{color:var(--muted);font-weight:500}
.empty{color:var(--muted);padding:14px 4px}
footer{margin-top:56px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
footer p{margin:0 0 6px}
@media (prefers-reduced-motion:no-preference){ .pick{animation:rise .25s ease-out} @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="wrap">
  <h1>약 이름을 넣으면<br>성분과 카피약이 나옵니다</h1>
  <p class="lead">제품 이름(예: 타이레놀, 리피토)이나 성분 이름으로 찾으세요.</p>

  <div class="search" role="search">
    <input id="q" type="search" autocomplete="off" placeholder="약 이름 입력" aria-label="약 이름" aria-controls="suggest" disabled>
    <label class="avail"><input type="checkbox" id="onlyAvail" checked> 시중에서 구할 수 있는 제품만 <small id="availNote">(수출용 제외)</small></label>
    <div id="status" class="status" aria-live="polite">자료를 불러오는 중입니다…</div>
    <ul id="suggest" class="suggest"></ul>
  </div>

  <div id="result"></div>

  <footer>
    <p>성분과 함량이 같아도 제형(정제·캡슐·주사 등), 첨가제, 허가받은 효능이 다를 수 있습니다. 약을 바꾸실 때는 의사·약사와 상담하세요.</p>
    <p>'가장 먼저 허가'는 허가일 기준 표시이며, 오리지널 약 여부를 확인한 것은 아닙니다.</p>
    <p>자료: 식품의약품안전처 의약품 제품 허가정보(공공데이터포털), 취소·취하된 제품은 제외. <span id="updated"></span></p>
  </footer>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const qEl = $('#q'), statusEl = $('#status'), sugEl = $('#suggest'), resEl = $('#result');
  const UNIT = { '밀리그램':'mg', '밀리그람':'mg', '그램':'g', '마이크로그램':'µg', '밀리리터':'mL', '리터':'L', '킬로그램':'kg' };
  const KIND = ['', '전문의약품', '일반의약품'];
  let D = null, norm = [], ingNorm = [], exact = new Map(), bySet = new Map(), byIng = new Map();

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const n = (s) => String(s).toLowerCase().replace(/\s+/g, '');
  const fmtDate = (d) => d && d.length === 8 ? `${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6)}` : '';
  const setKey = (key) => key.split(';').map((x) => x.split(':')[0]).join(',');
  const parts = (key) => key.split(';').map((x) => {
    const [i, q, u] = x.split(':'); const unit = D.units[+u] || '';
    return { name: D.ing[+i][1], qty: q, unit: UNIT[unit] || unit };
  });
  const strengthText = (key) => parts(key).map((p) => p.qty ? `${p.qty}${p.unit}` : '함량 정보 없음').join(' + ');

  async function load() {
    let meta;
    try {
      const m = await fetch(`data/meta.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!m.ok) throw new Error('missing');
      meta = await m.json();
      const res = await fetch(`data/drugs.json?v=${encodeURIComponent(meta.updated)}`);
      if (!res.ok) throw new Error('missing');
      D = await res.json();
    } catch {
      statusEl.textContent = '약 자료를 준비하고 있습니다. 잠시 뒤 다시 열어 주세요.';
      statusEl.classList.add('err');
      return false;
    }
    norm = D.p.map((p) => n(p[1]));
    ingNorm = D.ing.map((x) => n(x[1]));
    exact = new Map(); bySet = new Map(); byIng = new Map();
    D.c.forEach((key, i) => {
      new Set(setKey(key).split(',')).forEach((g) => { if (!byIng.has(g)) byIng.set(g, []); byIng.get(g).push(i); });
      if (!exact.has(key)) exact.set(key, []); exact.get(key).push(i);
      const sk = setKey(key); if (!bySet.has(sk)) bySet.set(sk, []); bySet.get(sk).push(i);
    });
    $('#updated').textContent = `갱신일 ${new Date(D.updated).toLocaleDateString('ko-KR')}`;
    statusEl.classList.remove('err');
    statusEl.textContent = `제품 ${D.p.length.toLocaleString()}개를 찾을 수 있습니다.`;
    $('#availNote').textContent = D.otcSupply ? '(수출용, 공급 실적 없는 일반의약품 제외)' : '(수출용 제외)';
    qEl.disabled = false; qEl.focus();
    route();
    return true;
  }

  function search(q) {
    const tokens = q.split(/\s+/).map(n).filter(Boolean);
    if (!tokens.length) return [];
    const whole = n(q);
    // 성분 이름이 맞으면 그 성분이 들어간 제품도 함께 찾는다.
    const ingHit = new Set(); if (whole.length >= 2) ingNorm.forEach((s, i) => { if (s.includes(whole)) ingHit.add(i); });
    const hits = [];
    for (let i = 0; i < norm.length; i++) {
      const s = norm[i];
      let ok = tokens.every((t) => s.includes(t));
      if (!ok && ingHit.size) ok = D.c[i].split(';').some((x) => ingHit.has(+x.split(':')[0]));
      if (!ok) continue;
      const pos = s.indexOf(tokens[0]);
      hits.push([i, pos < 0 ? 999 : pos, s.length]);
    }
    hits.sort((a, b) => a[1] - b[1] || a[2] - b[2]);
    return hits.map((h) => h[0]);
  }

  // 글자 하나를 잘못 친 경우(예: 리조랄 → 니조랄)를 자모 단위로 비교해 가까운 이름을 찾는다.
  const jamo = (ch) => {
    const c = ch.charCodeAt(0) - 0xAC00;
    return c >= 0 && c < 11172 ? [Math.floor(c / 588), Math.floor((c % 588) / 28), c % 28] : [ch];
  };
  const sylDiff = (a, b) => {
    if (a === b) return 0;
    const x = jamo(a), y = jamo(b);
    if (x.length !== 3 || y.length !== 3) return 3;
    return (x[0] !== y[0]) + (x[1] !== y[1]) + (x[2] !== y[2]);
  };
  function nearNames(q) {
    const t = n(q); if (t.length < 2) return [];
    const best = new Map(); // 후보 이름 → 점수
    for (let i = 0; i < norm.length; i++) {
      if (onlyEl.checked && !avail(i)) continue;
      const s = norm[i];
      for (let k = 0; k + t.length <= s.length && k <= 3; k++) {
        let score = 0, changed = 0;
        for (let m = 0; m < t.length && score <= 2; m++) { const d = sylDiff(t[m], s[k + m]); if (d) { score += d; changed++; } }
        if (score === 0 || score > 2 || changed > 1) continue;
        const w = s.slice(k, k + t.length); const sc = score + k * 0.1;
        if (!best.has(w) || best.get(w) > sc) best.set(w, sc);
      }
    }
    return [...best.entries()].sort((a, b) => a[1] - b[1]).slice(0, 4).map((x) => x[0]);
  }

  function showSuggest() {
    const q = qEl.value.trim();
    sugEl.innerHTML = '';
    if (!D || q.length < 1) { statusEl.textContent = D ? `제품 ${D.p.length.toLocaleString()}개를 찾을 수 있습니다.` : statusEl.textContent; return; }
    const allHits = search(q);
    const hits = allHits.filter(keep);
    statusEl.classList.remove('err');
    if (!hits.length) {
      if (allHits.length) { statusEl.textContent = `'${q}'(으)로 찾은 제품 ${allHits.length}개가 모두 수출용 등 시중에서 구하기 어려운 제품입니다. 위의 선택을 끄면 볼 수 있습니다.`; return; }
      const near = nearNames(q);
      statusEl.innerHTML = `'${esc(q)}'(으)로 찾은 제품이 없습니다.` + (near.length
        ? `<div class="typo">혹시 이 약인가요? ${near.map((w) => `<button type="button" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>`
        : ' 이름 일부만 넣거나 성분 이름으로 찾아 보세요.');
      statusEl.querySelectorAll('.typo button').forEach((b) => b.addEventListener('click', () => { qEl.value = b.dataset.w; showSuggest(); }));
      return;
    }
    statusEl.textContent = `${hits.length.toLocaleString()}개 제품이 있습니다. 하나를 고르세요.`;
    const LIMIT = 40;
    sugEl.innerHTML = hits.slice(0, LIMIT).map((i) => {
      const p = D.p[i];
      const ps = parts(D.c[i]);
      const cp = ps.slice(0, 2).map((g) => `${g.name}${g.qty ? ' ' + g.qty + g.unit : ''}`).join(' + ') + (ps.length > 2 ? ` 외 ${ps.length - 2}종` : '');
      return `<li><button type="button" data-i="${i}"><span class="left"><span class="nm">${esc(p[1])}</span><span class="cp">${esc(cp)}</span></span><span class="co">${esc(p[2])}</span></button></li>`;
    }).join('') + (hits.length > LIMIT ? `<li class="more">그 밖에 ${(hits.length - LIMIT).toLocaleString()}개가 더 있습니다. 함량이나 제형(예: 500, 정)을 함께 넣어 좁혀 보세요.</li>` : '');
  }

  function rowsHtml(list, me, firstIdx) {
    return list.map((i) => {
      const p = D.p[i];
      return `<tr class="${i === me ? 'me' : ''}" data-name="${esc(n(p[1] + p[2]))}">
        <td><a class="prod" href="#seq=${esc(p[0])}">${esc(p[1])}</a>${i === firstIdx ? '<span class="first">가장 먼저 허가</span>' : ''}</td>
        <td>${esc(p[2])}</td><td class="kind">${KIND[p[4]] || ''}</td><td class="date">${fmtDate(p[3])}</td>
        <td>${p[6] ? `<button type="button" class="phbtn" data-img="${esc(p[6])}" data-name="${esc(p[1])}" aria-expanded="false">사진</button>` : ''}</td></tr>`;
    }).join('');
  }
  const onlyEl = $('#onlyAvail');
  // 수출용은 국내에서 팔지 않음. 일반의약품은 e약은요 공급 실적 자료가 있을 때 거기 있는 것만 유통으로 봄.
  const avail = (i) => {
    const f = D.p[i][5] || 0;
    if (f & 1) return false;
    if (D.otcSupply && D.p[i][4] === 2 && !(f & 2)) return false;
    return true;
  };
  const keep = (i) => !onlyEl.checked || avail(i);
  const hiddenNote = (all, shown) => all > shown ? `<div class="hidden-note">수출용 등 시중에서 구하기 어려운 제품 ${all - shown}개는 숨겼습니다.</div>` : '';
  const imgUrl = (id) => `https://nedrug.mfds.go.kr/pbp/cmn/itemImageDownload/${encodeURIComponent(id)}`;
  const byDate = (a, b) => (D.p[a][3] || '99999999').localeCompare(D.p[b][3] || '99999999');
  const tableHtml = (body) => `<div class="tbl"><table><thead><tr><th>제품명</th><th>회사</th><th class="kind">구분</th><th>허가일</th><th><span class="sr">사진</span></th></tr></thead><tbody>${body}</tbody></table></div>`;

  const SHARDS = 128;
  const shardOf = (key) => { let h = 5381; for (const ch of key) h = ((h * 33) ^ ch.charCodeAt(0)) >>> 0; return h % SHARDS; };
  const infoCache = new Map();
  async function showInfo(i) {
    const box = $('#info'); if (!box) return;
    const key = D.c[i], n = shardOf(key), seq = D.p[i][0];
    try {
      if (!infoCache.has(n)) {
        const r = await fetch(`data/info/${n}.json?v=${encodeURIComponent(D.updated)}`);
        infoCache.set(n, r.ok ? await r.json() : {});
      }
    } catch { infoCache.set(n, {}); }
    if ($('#info') !== box) return; // 그사이 다른 약을 고른 경우
    const it = infoCache.get(n)[key];
    const link = `<a href="https://nedrug.mfds.go.kr/pbp/CCBBB01/getItemDetail?itemSeq=${encodeURIComponent(seq)}" target="_blank" rel="noopener">의약품안전나라에서 전체 허가사항 보기</a>`;
    if (!it) { box.innerHTML = `<p class="info-src">효능·부작용 요약 자료가 없습니다. ${link}</p>`; return; }
    const [eff, se, src] = it;
    box.innerHTML = `
      <div class="box"><h3>효능</h3><p>${esc(eff || '요약 자료 없음')}</p></div>
      <div class="box se"><h3>주요 부작용</h3><p>${esc(se || '요약 자료 없음')}</p></div>
      <p class="info-src">${src === 1 ? '식약처 e약은요' : '식약처 허가사항'} 자료를 짧게 줄인 내용이며, 같은 성분·함량 제품의 자료를 함께 씁니다. ${link}</p>`;
  }

  function showProduct(i) {
    const p = D.p[i], key = D.c[i];
    const ings = parts(key);
    const sameAll = (exact.get(key) || []).filter((x) => x !== i);
    const same = [i, ...sameAll.filter(keep)].sort(byDate);
    const firstIdx = same.find((x) => D.p[x][3]);
    const othersAll = (bySet.get(setKey(key)) || []).filter((x) => D.c[x] !== key);
    const others = othersAll.filter(keep);
    const groups = new Map(); others.forEach((x) => { const k = D.c[x]; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); });
    // 복합제: 주성분이 한 가지만 다르고 나머지는 같은 제품 (예: 같은 약초라도 추출 방법이 다른 원료)
    const mySet = [...new Set(setKey(key).split(','))];
    const similar = []; let similarAll = 0;
    if (mySet.length >= 2) {
      const shared = new Map();
      mySet.forEach((g) => (byIng.get(g) || []).forEach((x) => shared.set(x, (shared.get(x) || 0) + 1)));
      shared.forEach((cnt, x) => {
        if (x === i || setKey(D.c[x]) === setKey(key)) return;
        const other = new Set(setKey(D.c[x]).split(','));
        const missing = mySet.length - cnt, extra = other.size - cnt;
        if (cnt >= 2 && missing <= 1 && extra <= 1) { similarAll++; if (keep(x)) similar.push([x, cnt, missing, extra]); }
      });
      similar.sort((a, b) => b[1] - a[1] || (a[2] + a[3]) - (b[2] + b[3]) || byDate(a[0], b[0]));
    }
    const diffText = (x) => {
      const mine = new Set(mySet), theirs = new Set(setKey(D.c[x]).split(','));
      const name = (g) => D.ing[+g][1];
      const lack = mySet.filter((g) => !theirs.has(g)).map(name);
      const plus = [...theirs].filter((g) => !mine.has(g)).map(name);
      return [lack.length ? `없음: <b>${esc(lack.join(', '))}</b>` : '', plus.length ? `대신 들어감: <b>${esc(plus.join(', '))}</b>` : ''].filter(Boolean).join('<br>');
    };
    const ingLine = ings.map((g) => `<div class="ing">${esc(g.name)} <span>${esc(g.qty ? g.qty + g.unit : '')}</span></div>`).join('');

    resEl.innerHTML = `
      <div class="pick">
        <div class="capsule">
          <div class="a"><div class="name">${esc(p[1])}</div><div class="sub">${esc(p[2])}</div></div>
          <div class="b" aria-label="주성분">${ingLine}</div>
        </div>
        <div class="tags">${p[4] ? `<span class="tag">${KIND[p[4]]}</span>` : ''}${p[3] ? `<span class="tag">허가 ${fmtDate(p[3])}</span>` : ''}<span class="tag">주성분 ${ings.length}종</span></div>
        ${p[6] ? `<figure class="pill"><img src="${imgUrl(p[6])}" alt="${esc(p[1])} 낱알 사진" loading="lazy" onerror="this.closest('figure').remove()"><figcaption>낱알 사진 · 식약처 의약품안전나라</figcaption></figure>` : ''}
        <div class="info" id="info" aria-live="polite"></div>
      </div>

      <section class="group">
        <div class="ghead"><span class="n">${(same.length - 1).toLocaleString()}</span><h2>같은 성분·같은 함량의 다른 제품</h2>
          <p>주성분과 함량이 모두 같은 제품입니다. 흔히 말하는 카피약(복제약)이 여기에 해당합니다. 허가일 순으로 정렬했습니다.</p></div>
        ${same.length > 8 ? '<div class="filter"><input id="f" type="search" placeholder="목록 안에서 제품명·회사 찾기" aria-label="목록 안에서 찾기"></div>' : ''}
        ${same.length > 1 ? tableHtml(rowsHtml(same, i, firstIdx)) : '<div class="empty">주성분과 함량이 같은 다른 제품이 없습니다.</div>'}
        ${hiddenNote(sameAll.length + 1, same.length)}
      </section>

      <section class="group">
        <div class="ghead"><span class="n">${others.length.toLocaleString()}</span><h2>같은 성분·다른 함량</h2>
          <p>주성분 구성은 같고 함량만 다른 제품입니다. 함량별로 묶었습니다.</p></div>
        ${groups.size ? [...groups.entries()].sort((a, b) => b[1].length - a[1].length).map(([k, list]) =>
          `<details class="strength"><summary>${esc(strengthText(k))} <span>${list.length}개</span></summary>${tableHtml(rowsHtml(list.sort(byDate), -1, -1))}</details>`).join('')
          : '<div class="empty">함량만 다른 제품은 없습니다.</div>'}
        ${hiddenNote(othersAll.length, others.length)}
      </section>
      ${mySet.length >= 2 ? `<section class="group">
        <div class="ghead"><span class="n">${similar.length.toLocaleString()}</span><h2>주성분이 한 가지만 다른 제품</h2>
          <p>여러 성분이 섞인 약(복합제)에서, 성분 하나만 빠지거나 다른 원료로 바뀐 제품입니다. 같은 약초라도 원료 규격이 다르면 여기에 나옵니다.</p></div>
        ${similar.length ? `<div class="tbl"><table><thead><tr><th>제품명</th><th>회사</th><th>차이</th><th>허가일</th></tr></thead><tbody>${
          similar.slice(0, 60).map(([x]) => { const q = D.p[x]; return `<tr><td><a class="prod" href="#seq=${esc(q[0])}">${esc(q[1])}</a></td><td>${esc(q[2])}</td><td class="diff">${diffText(x)}</td><td class="date">${fmtDate(q[3])}</td></tr>`; }).join('')
        }</tbody></table></div>${hiddenNote(similarAll, similar.length)}${similar.length > 60 ? `<div class="empty">그 밖에 ${similar.length - 60}개가 더 있습니다.</div>` : ''}` : '<div class="empty">해당하는 제품이 없습니다.</div>' + hiddenNote(similarAll, 0)}
      </section>` : ''}`;

    const f = $('#f');
    if (f) f.addEventListener('input', () => {
      const t = n(f.value);
      resEl.querySelectorAll('section.group:first-of-type tbody tr').forEach((tr) => { tr.hidden = t && !tr.dataset.name.includes(t); });
    });
    document.title = `${p[1]} 성분·카피약`;
    showInfo(i);
  }

  function route() {
    const m = location.hash.match(/seq=([^&]+)/);
    if (!m || !D) { resEl.innerHTML = ''; return; }
    const i = D.p.findIndex((p) => p[0] === decodeURIComponent(m[1]));
    if (i < 0) { resEl.innerHTML = '<div class="empty">해당 제품을 찾지 못했습니다. 자료가 갱신되면서 빠졌을 수 있습니다.</div>'; return; }
    sugEl.innerHTML = '';
    statusEl.classList.remove('err');
    statusEl.textContent = '다른 약을 찾으려면 이름을 다시 입력하세요.';
    showProduct(i);
    resEl.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  resEl.addEventListener('click', (e) => {
    const b = e.target.closest('.phbtn'); if (!b) return;
    const tr = b.closest('tr'), next = tr.nextElementSibling;
    if (next && next.classList.contains('photo')) { next.remove(); b.setAttribute('aria-expanded', 'false'); return; }
    const row = document.createElement('tr'); row.className = 'photo';
    row.innerHTML = `<td colspan="${tr.children.length}"><img src="${imgUrl(b.dataset.img)}" alt="${esc(b.dataset.name)} 낱알 사진" loading="lazy"><small>식약처 의약품안전나라</small></td>`;
    row.querySelector('img').onerror = () => { row.querySelector('td').innerHTML = '<small>사진을 불러오지 못했습니다.</small>'; };
    tr.after(row); b.setAttribute('aria-expanded', 'true');
  });

  let timer;
  qEl.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(showSuggest, 120); });
  qEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { const b = sugEl.querySelector('button'); if (b) b.click(); }
    if (e.key === 'ArrowDown') { const b = sugEl.querySelector('button'); if (b) { e.preventDefault(); b.focus(); } }
  });
  sugEl.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-i]'); if (!b) return;
    location.hash = `seq=${encodeURIComponent(D.p[+b.dataset.i][0])}`;
  });
  sugEl.addEventListener('keydown', (e) => {
    const li = e.target.closest('li'); if (!li) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); li.nextElementSibling?.querySelector('button')?.focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); (li.previousElementSibling?.querySelector('button') || qEl).focus(); }
  });
  onlyEl.addEventListener('change', () => { if (!D) return; if (qEl.value.trim()) showSuggest(); if (location.hash) route(); });
  window.addEventListener('hashchange', route);
  load();
})();
</script>
</body>
</html>
