name: 의약품 자료 갱신

on:
  schedule:
    - cron: '0 18 * * 0'   # 매주 월요일 새벽 3시(한국시간)
  workflow_dispatch: {}     # Actions 탭에서 직접 실행(처음 한 번)

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: 식약처 자료 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/collect.mjs
      - name: 바뀐 자료 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "의약품 자료 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: 사이트 다시 게시 요청
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "게시 요청 생략"
